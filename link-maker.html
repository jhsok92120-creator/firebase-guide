<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안내서 링크 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#0b3417; --raspberry:#146c34; --paper:#f5f4ee; --card:#ffffff;
    --rose-tint:#e6f0e8; --ink:#1b241d; --ink-soft:#5c665e; --gold:#b8873f;
    --blue:#2e5e8f; --blue-tint:#e8f0f7; --line:#dee3da; --done:#2f8f5b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Noto Sans KR', sans-serif; background:var(--paper); color:var(--ink);
    padding:40px 20px 80px;
  }
  .wrap{ max-width:720px; margin:0 auto; }
  h1{ font-size:26px; font-weight:800; margin:0 0 6px; }
  .sub{ font-size:15px; color:var(--ink-soft); margin:0 0 28px; line-height:1.6; }
  .note{
    background:var(--rose-tint); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; font-size:14px; color:var(--ink-soft); margin-bottom:28px; line-height:1.6;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px;
    box-shadow:0 2px 10px rgba(11,52,23,.05);
  }
  .field-label{ font-size:14px; font-weight:700; margin-bottom:8px; display:block; }
  input[type="text"]{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; font-family:inherit; color:var(--ink); background:var(--paper);
  }
  .tab-list{ margin-top:22px; }
  .titem{
    display:flex; align-items:center; gap:12px; padding:12px 10px; border-radius:8px;
    cursor:pointer; user-select:none; border:1px solid transparent;
  }
  .titem:hover{ background:var(--rose-tint); }
  .titem input{ width:18px; height:18px; accent-color:var(--raspberry); cursor:pointer; }
  .titem .num{
    width:24px; height:24px; border-radius:50%; background:var(--blue-tint); color:var(--blue);
    font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .titem .name{ font-size:15px; font-weight:500; }
  .actions{ display:flex; gap:10px; margin-top:24px; }
  button{
    font-family:inherit; font-size:15px; font-weight:700; border:none; border-radius:8px;
    padding:13px 18px; cursor:pointer;
  }
  .btn-primary{ background:var(--plum); color:#fff; flex:1; }
  .btn-primary:hover{ background:var(--raspberry); }
  .btn-ghost{ background:var(--paper); color:var(--ink); border:1px solid var(--line); }
  .result{
    margin-top:22px; padding:16px; background:var(--paper); border:1px solid var(--line);
    border-radius:10px; display:none;
  }
  .result.show{ display:block; }
  .result-label{ font-size:13px; color:var(--ink-soft); margin-bottom:8px; }
  .result-url{
    font-size:14px; word-break:break-all; background:var(--card); border:1px solid var(--line);
    border-radius:6px; padding:10px 12px; color:var(--plum); font-weight:600;
  }
  .copy-btn{
    margin-top:12px; width:100%; background:var(--done); color:#fff;
  }
  .copy-btn.copied{ background:var(--gold); }
  .select-row{ display:flex; gap:8px; margin-top:16px; }
  .select-row button{ font-size:13px; padding:8px 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>안내서 맞춤 링크 만들기</h1>
  <p class="sub">원장님께 보낼 탭만 선택하면, 그 탭만 보이는 링크가 만들어집니다. (이 페이지는 전희석님만 쓰는 내부 도구입니다)</p>

  <div class="note">
    💡 탭을 하나도 선택하지 않으면 <b>전체 가이드 링크</b>가 그대로 만들어집니다. 특정 작업만 요청할 땐 해당 탭만 체크해 주세요.
  </div>

  <div class="card">
    <label class="field-label">가이드 기본 주소</label>
    <input type="text" id="baseUrl" value="https://jhsok92120-creator.github.io/firebase-guide/">

    <div class="tab-list" id="tabList">
      <label class="titem"><input type="checkbox" value="firebase"><span class="num">1</span><span class="name">Firebase 설정</span></label>
      <label class="titem"><input type="checkbox" value="domain"><span class="num">2</span><span class="name">도메인 연결</span></label>
      <label class="titem"><input type="checkbox" value="kakao"><span class="num">3</span><span class="name">카카오맵 API</span></label>
      <label class="titem"><input type="checkbox" value="naver"><span class="num">4</span><span class="name">네이버 지도 API</span></label>
      <label class="titem"><input type="checkbox" value="ga"><span class="num">5</span><span class="name">구글 애널리틱스(GA4)</span></label>
      <label class="titem"><input type="checkbox" value="gsc"><span class="num">6</span><span class="name">구글 서치콘솔</span></label>
      <label class="titem"><input type="checkbox" value="nsa"><span class="num">7</span><span class="name">네이버 서치어드바이저</span></label>
      <label class="titem"><input type="checkbox" value="nal"><span class="num">8</span><span class="name">네이버 애널리틱스</span></label>
    </div>

    <div class="select-row">
      <button class="btn-ghost" id="selectAll">전체 선택</button>
      <button class="btn-ghost" id="selectNone">선택 해제</button>
    </div>

    <div class="actions">
      <button class="btn-primary" id="makeBtn">링크 만들기</button>
    </div>

    <div class="result" id="result">
      <div class="result-label">생성된 링크</div>
      <div class="result-url" id="resultUrl"></div>
      <button class="copy-btn" id="copyBtn">링크 복사</button>
    </div>
  </div>
</div>

<script>
  const baseUrlInput = document.getElementById('baseUrl');
  const tabList = document.getElementById('tabList');
  const makeBtn = document.getElementById('makeBtn');
  const result = document.getElementById('result');
  const resultUrl = document.getElementById('resultUrl');
  const copyBtn = document.getElementById('copyBtn');

  document.getElementById('selectAll').addEventListener('click', ()=>{
    tabList.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.checked=true);
  });
  document.getElementById('selectNone').addEventListener('click', ()=>{
    tabList.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.checked=false);
  });

  makeBtn.addEventListener('click', ()=>{
    let base = baseUrlInput.value.trim();
    if(!base){ base = 'https://jhsok92120-creator.github.io/firebase-guide/'; }
    if(!base.endsWith('/') && !base.includes('.html')){ base += '/'; }
    const checked = Array.from(tabList.querySelectorAll('input[type="checkbox"]:checked')).map(cb=>cb.value);
    const url = checked.length ? `${base}?only=${checked.join(',')}` : base;
    resultUrl.textContent = url;
    result.classList.add('show');
    copyBtn.classList.remove('copied');
    copyBtn.textContent = '링크 복사';
  });

  copyBtn.addEventListener('click', async ()=>{
    try{
      await navigator.clipboard.writeText(resultUrl.textContent);
      copyBtn.textContent = '복사 완료 ✓';
      copyBtn.classList.add('copied');
    }catch(e){
      const range = document.createRange();
      range.selectNode(resultUrl);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      copyBtn.textContent = '복사 완료 ✓';
      copyBtn.classList.add('copied');
    }
  });
</script>
</body>
</html>
